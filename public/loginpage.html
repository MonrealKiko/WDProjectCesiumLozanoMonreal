<div class="post-container">
    <h2>Make a Post</h2>

    <form id="postForm">
        <label for="date">Date</label>
        <input type="date" id="date" required>

        <label for="title">Post Title</label>
        <input type="text" id="title" required>

        <label for="description">Post Description</label>
        <textarea id="description" required></textarea>

        <label for="image">Optional Image</label>
        <input type="file" id="image" accept="image/*">

        <button type="submit">Submit Post</button>
    </form>
</div>

<script>
document.getElementById("postForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const reader = new FileReader();
    const imageFile = document.getElementById("image").files[0];

    const newPost = {
        date: document.getElementById("date").value,
        title: document.getElementById("title").value,
        description: document.getElementById("description").value,
        image: null
    };

    if (imageFile) {
        reader.onload = function () {
            newPost.image = reader.result;
            savePost(newPost);
        };
        reader.readAsDataURL(imageFile);
    } else {
        savePost(newPost);
    }

    function savePost(post) {

        const posts = JSON.parse(localStorage.getItem("postsData") || "[]");


        posts.push(post);

        localStorage.setItem("postsData", JSON.stringify(posts));

        window.location.href = "../public/posts.html";
    }
});
</script>

    <div class="post-display" id="postDisplay"></div>
</div>

<script>
const container = document.getElementById("postDisplay");

function getPosts() {
    return JSON.parse(localStorage.getItem("postsData") || "[]");
}

function savePosts(posts) {
    localStorage.setItem("postsData", JSON.stringify(posts));
}

function deletePost(id) {
    let posts = getPosts();
    posts = posts.filter(post => post.id !== id);
    savePosts(posts);
    renderPosts();
}

function editPost(id) {
    let posts = getPosts();
    const post = posts.find(p => p.id === id);

    if (!post) return;

    const newTitle = prompt("Edit title:", post.title);
    const newDesc = prompt("Edit description:", post.description);

    if (newTitle !== null) post.title = newTitle;
    if (newDesc !== null) post.description = newDesc;

    savePosts(posts);
    renderPosts();
}

function renderPosts() {
    const posts = getPosts();

    if (posts.length === 0) {
        container.innerHTML = "<p>No posts found.</p>";
        return;
    }

    container.innerHTML = posts.map(post => `
        <div class="single-post">
            <h1>${post.title}</h1>
            <div class="post-date">${post.date}</div>
            <p>${post.description}</p>
            ${post.image ? `<img src="${post.image}" class="post-image">` : ""}

            <div class="post-actions">
                <button class="edit-btn" onclick="editPost(${post.id})">Edit</button>
                <button class="delete-btn" onclick="deletePost(${post.id})">Delete</button>
            </div>
        </div>
    `).join("");
}

renderPosts();
</script>
